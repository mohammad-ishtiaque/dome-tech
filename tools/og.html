<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@500;600&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:"Plus Jakarta Sans",sans-serif;color:#0b1f44;position:relative;background:radial-gradient(640px 460px at 92% 8%,rgba(34,195,238,.38),transparent 62%),radial-gradient(560px 460px at 0% 0%,rgba(124,188,255,.6),transparent 60%),radial-gradient(600px 400px at 60% 120%,rgba(139,92,246,.18),transparent 60%),linear-gradient(180deg,#e3f0ff,#f3f9ff)}
.wrap{position:absolute;inset:68px 80px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;letter-spacing:.14em;font-size:24px}
.brand img{filter:drop-shadow(0 10px 18px rgba(31,122,255,.45))}
h1{font-size:78px;line-height:1.03;letter-spacing:-.04em;margin:auto 0 18px;font-weight:800}
h1 span{background:linear-gradient(120deg,#1f7aff,#3b8dff 40%,#22c3ee);-webkit-background-clip:text;color:transparent}
p{font-family:Inter,sans-serif;font-weight:500;font-size:26px;color:#3a4a68;margin:0 0 32px}
.chips{display:flex;gap:14px}
.chips div{display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:16px;background:#fff;box-shadow:0 18px 36px -18px rgba(17,79,192,.45);font-weight:700;font-size:22px}
.chips i{width:32px;height:32px;border-radius:9px;display:block}
svg.arc{position:absolute;right:-40px;top:70px;width:500px}
.stat{position:absolute;right:90px;top:120px;padding:14px 20px;border-radius:18px;color:#fff;background:linear-gradient(120deg,#1f7aff,#22c3ee);box-shadow:0 20px 40px -14px rgba(31,122,255,.7);font-family:Inter,sans-serif;font-size:16px;line-height:1.25}
.stat b{display:block;font-family:"Plus Jakarta Sans";font-size:40px;letter-spacing:-.03em}
</style></head><body>
