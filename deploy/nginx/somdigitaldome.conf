# Digital Dome: website (somdigitaldome.com) and dashboard (admin.somdigitaldome.com).
# Lives next to any other sites in /etc/nginx/sites-available and does not change them.
# Certbot adds the HTTPS (443) blocks and the HTTP → HTTPS redirect to this file.

# Website: React Router server on 127.0.0.1:3100.
server {
    listen 80;
    listen [::]:80;
    server_name somdigitaldome.com www.somdigitaldome.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        proxy_pass http://127.0.0.1:3100;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Dashboard: static files copied to /var/www/dome-admin by deploy.sh; /api and /uploads go to the API,
# so the dashboard and API share one origin and the login cookie stays SameSite=Strict.
server {
    listen 80;
    listen [::]:80;
    server_name admin.somdigitaldome.com;

    root /var/www/dome-admin;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The dashboard is private: keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Image uploads are up to 8 MB (the API's own limit).
        client_max_body_size 9m;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4100;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Single-page app: unknown paths load index.html, which must never be cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
